# EoMT-B (DINOv2) on BTXRD: bone tumor detection + segmentation + benign/malignant
# classification in one pass. Normal radiographs (no mask) are part of the data.
# Data: the folder made by tools/prepare_btxrd.py (or tools/split_btxrd.py).
# Mask-annealing steps are left empty: MaskClassificationBTXRD derives them from
# the real number of training steps, with the proportions of the COCO configs.
#
# Fine-tune from EoMT-B COCO panoptic, as in the README:
#   python3 main.py fit -c configs/dinov2/btxrd/instance/eomt_base_640.yaml \
#     --data.path /path/to/btxrd_cache \
#     --model.ckpt_path /path/to/coco_panoptic_eomt_base_640_2x/pytorch_model.bin \
#     --model.load_ckpt_class_head False
trainer:
  max_epochs: 40
  check_val_every_n_epoch: 1
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      resume: allow
      project: "eomt"
      name: "btxrd_instance_eomt_base_640"
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: metrics/val_score
        mode: max
        save_last: true
        save_top_k: 1
        filename: "best-epoch{epoch:02d}"
        auto_insert_metric_name: false
model:
  class_path: training.mask_classification_btxrd.MaskClassificationBTXRD
  init_args:
    attn_mask_annealing_enabled: True
    warmup_steps: [500, 1000]
    tumor_score_thresh: 0.5
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 200
        num_blocks: 3
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_base_patch14_reg4_dinov2
data:
  class_path: datasets.btxrd.BTXRDInstance
  init_args:
    batch_size: 8
    img_size: [640, 640]
    check_empty_targets: false  # keep normal images (no tumor)
    balanced_sampling: true     # normal / benign / malignant sampled equally
